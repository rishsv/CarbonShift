# Time-of-Day electricity tariffs — INDICATIVE ONLY.
# These are illustrative averages; actual tariffs vary by state, DISCOM and consumer category.
# Do NOT use for billing or financial decisions.
# Source: Illustrative, based on ToD tariff ranges seen in southern and western Indian states.

disclaimer: "Indicative only. Actual tariffs vary by state, DISCOM, consumer category and year. Verify from SERC orders."

default_currency: INR

slots:
  solar_peak:
    label: "Solar hours"
    hours_ist: [10, 11, 12, 13, 14, 15]  # 10:00-16:00 IST
    rate_inr_per_kwh: 6.0
    notes: "Many DISCOMs offer reduced ToD rates during solar hours"

  normal:
    label: "Normal hours"
    hours_ist: [6, 7, 8, 9, 16, 17, 22, 23, 0, 1, 2, 3, 4, 5]
    rate_inr_per_kwh: 7.5
    notes: "Standard commercial/industrial rate"

  evening_peak:
    label: "Evening peak"
    hours_ist: [18, 19, 20, 21]  # 18:00-22:00 IST
    rate_inr_per_kwh: 9.5
    notes: "Peak demand surcharge; coal-heavy supply during this period"

  night:
    label: "Night hours"
    hours_ist: [22, 23, 0, 1, 2, 3, 4, 5]  # 22:00-06:00 IST
    rate_inr_per_kwh: 7.0
    notes: "Slightly reduced; demand lower but still thermal-heavy"
