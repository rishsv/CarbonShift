# Hardware power profiles — illustrative, derived from vendor datasheet TDPs.
# VERIFY against current vendor datasheets before claiming accuracy.
# idle_w: typical idle draw; max_w: TDP / peak draw.
# cpu_node: 1 node = 32 cores for power calculation purposes.

cpu_node:
  idle_w: 120
  max_w: 400
  cores_per_node: 32
  source_note: "Dual-socket server; illustrative. Actual varies with CPU model."

gpu_types:
  T4:
    idle_w: 10
    max_w: 70
    vram_gb: 16
    source_note: "NVIDIA T4 TDP 70W; idle ~10W. Tesla T4 datasheet."
  V100:
    idle_w: 40
    max_w: 300
    vram_gb: 32
    source_note: "NVIDIA V100 SXM2 TDP 300W. PCIe variant ~250W."
  A100:
    idle_w: 50
    max_w: 250
    vram_gb: 80
    source_note: "NVIDIA A100 PCIe 80GB TDP ~250W. SXM variant ~400W."
  H100:
    idle_w: 80
    max_w: 700
    vram_gb: 80
    source_note: "NVIDIA H100 SXM5 TDP ~700W. PCIe variant ~350W."

# Archetype-level defaults (resources, utilization, preemptible)
archetypes:
