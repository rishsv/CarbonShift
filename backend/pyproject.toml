[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carbonshift-backend"
version = "0.1.0"
description = "CarbonShift AI — Carbon-aware workload scheduler for India"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlmodel>=0.0.19",
    "alembic>=1.13.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "numpy>=1.26.0",
    "lightgbm>=4.3.0",
    "scikit-learn>=1.4.0",
    "ortools>=9.10.0",
    "httpx>=0.27.0",
    "anyio>=4.3.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
    "joblib>=1.4.0",
    "aiofiles>=23.2.0",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "hypothesis>=6.100.0",
]
llm = [
    "anthropic>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP", "B", "A"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
